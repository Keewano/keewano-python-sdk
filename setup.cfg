; flake8 configuration.
;
; flake8 does not read pyproject.toml (it has declined to, for years), so its settings
; live here rather than next to [tool.black]. Keep the two line lengths in step.
[flake8]
; Matches [tool.black] line-length in pyproject.toml. flake8 and black must agree, or
; every black-formatted line at the limit becomes an E501.
max-line-length = 120

; E203 is the one rule black and pycodestyle genuinely disagree on, and black's own
; documentation says to disable it: black writes a complex slice as
; `data[offset : offset + count]` (PEP 8 treats the colon as a binary operator needing
; equal space on both sides), which pycodestyle reports as "whitespace before ':'".
; Left as the only exclusion on purpose -- everything else the formatter and the linter
; both want, so nothing else needs an escape.
extend-ignore = E203

; Nothing here is source we wrote. build/ and dist/ are build outputs, *.egg-info is
; setuptools metadata, and .venv/ is whatever local environment the developer made.
; flake8 has no SCM awareness, so a gitignored directory is still walked unless listed.
; sample/keewano_custom_events.py is codegen output that asks to be skipped in its own
; header, for the same reason it is force-excluded from black in pyproject.toml.
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    sample/keewano_custom_events.py
